<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5ef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>VoiceREC · 文字起こし編集</title>
<style>
:root { color-scheme: light; --paper: #f6f5ef; --ink: #202b27; --sub: #52625b; --line: #cbd4cc; --green: #155747; --white: #fffefa; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
.shell { max-width: 1160px; margin: auto; padding: 24px max(18px, env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)); }
header, .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
header { padding-bottom: 17px; border-bottom: 1px solid var(--line); }
.brand { font-size: 1.2rem; font-weight: 780; letter-spacing: -.035em; }
h1 { font-size: clamp(1.7rem, 5vw, 2.75rem); letter-spacing: -.045em; line-height: 1.15; margin: 28px 0 5px; }
p { margin: 0; }
.lede, .note, .status { color: var(--sub); }
.note, .status { font-size: .9rem; }
.action-bar { margin: 22px 0 12px; }
.editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.panel { border: 1px solid var(--line); border-radius: 15px; background: var(--white); padding: 14px; min-width: 0; }
.panel label { font-weight: 730; }
.panel .row { min-height: 44px; margin-bottom: 8px; }
textarea { width: 100%; min-height: 48vh; resize: vertical; display: block; background: var(--white); color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: inherit; }
button, select, input { min-height: 44px; font: inherit; color: inherit; background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
button { cursor: pointer; }
button.primary { background: var(--green); color: white; border-color: var(--green); font-weight: 700; }
button:disabled { opacity: .52; cursor: default; }
:focus-visible { outline: 3px solid #347a67; outline-offset: 2px; }
.status { min-height: 1.6em; margin-top: 8px; overflow-wrap: anywhere; }
.status[data-error="true"] { color: #9a3028; }
#settings { margin-top: 16px; padding: clamp(16px, 3vw, 24px); }
#settings h2 { margin: 0 0 8px; font-size: 1.15rem; }
.settings-fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 20px; }
.setting-field { display: grid; align-content: start; min-width: 0; gap: 4px; }
.setting-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.setting-heading small { color: var(--sub); font-weight: normal; }
.setting-field input, .setting-field select { width: 100%; min-width: 0; font-size: 1rem; }
#apiDetails { white-space: pre-line; overflow-wrap: anywhere; }
#savedKeysField { margin: 0 0 12px; }
#profiles { max-width: 100%; }
#keyHelp { margin-top: 4px; }
#settings .status { min-height: 0; }
#settings .status:empty { margin: 0; }
.text-button { border: 0; padding: 6px; color: var(--green); background: transparent; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
#advanced { margin-top: 14px; border-top: 1px solid var(--line); }
#advanced summary { cursor: pointer; min-height: 44px; padding: 10px 0; color: var(--sub); }
.settings-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
[hidden] { display: none !important; }
@media (max-width: 680px) {
    .editor, .settings-fields { grid-template-columns: 1fr; }
    .shell { padding-top: 15px; }
    textarea { min-height: 24vh; }
}
</style>
</head>
<body>
<main class="shell">
    <header>
        <span class="brand">VoiceREC</span>
        <button type="button" id="toggleSettings" aria-controls="settings" aria-expanded="false">API設定</button>
    </header>
    <section id="settings" class="panel" hidden aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">API設定</h2>
        <div class="settings-fields">
            <div class="setting-field">
                <div class="setting-heading"><label for="key">APIキー</label><small id="apiName">自動判定</small></div>
                <input id="key" type="password" placeholder="APIキーを貼り付け" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="keyHelp">
                <p id="keyHelp" class="note">貼り付けるとGoogleのAPIに固定の短文を送り、応答したモデルをこのブラウザに保存します。確認にはAPIの利用枠を使います。</p>
            </div>
            <div class="setting-field">
                <div class="setting-heading">
                    <label for="models">使用モデル</label>
                    <button class="text-button" type="button" id="list" hidden>Flash / Pro を再確認</button>
                </div>
                <select id="models" disabled><option value="">APIキーを貼り付けてください</option></select>
                <p id="listStatus" class="status" role="status"></p>
            </div>
        </div>
        <details id="advanced">
            <summary>詳細設定</summary>
            <div id="savedKeysField" class="settings-tools" hidden>
                <label for="profiles">保存済みのキー</label><select id="profiles"></select>
                <button class="text-button" type="button" id="remove" hidden>このキーを削除</button>
            </div>
            <div class="settings-fields">
                <label class="setting-field">手動で確認するAPI<select id="provider">
                    <option value="developer">Gemini Developer API（Google AI Studio）</option>
                    <option value="vertex-express">Vertex Express</option>
                </select></label>
                <label class="setting-field">個別に確認するモデルID
                    <input id="model" list="manualCandidates" placeholder="gemini-4-hydrogen" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
                    <datalist id="manualCandidates"><option value="gemini-4-hydrogen"></option></datalist>
                </label>
            </div>
            <div class="settings-tools">
                <button type="button" id="save" disabled>指定モデルを確認して使う</button>
                <button class="text-button" type="button" id="hydrogen" disabled>Hydrogenを確認して使う</button>
            </div>
            <p id="connectionStatus" class="status" role="status"></p>
            <p id="apiDetails" class="note"></p>
        </details>
    </section>
    <h1>文字起こしを整える</h1>
    <p class="lede">iPhoneのボイスメモで文字起こしをコピーし、原文欄に貼り付けてください。</p>
    <div class="row action-bar">
        <label for="mode">仕上げ方
            <select id="mode">
                <option value="clean">文字起こしの修正</option>
                <option value="meeting">会議録</option>
                <option value="medical">病状説明の要約</option>
                <option value="lecture">講義の要約</option>
                <option value="secure">機密情報に配慮した会議録</option>
            </select>
        </label>
        <span id="activeModel" class="note" role="status"></span>
    </div>
    <p class="note" id="privacy">原文は選択したGoogle APIに送信されます。個人情報は貼り付け前に伏せてください。</p>
    <div class="editor">
        <section class="panel">
            <div class="row">
                <label for="source">原文</label>
                <button type="button" class="primary" id="rewrite">整える</button>
            </div>
            <textarea id="source" placeholder="ボイスメモの文字起こしを貼り付け" aria-describedby="privacy" spellcheck="false"></textarea>
            <p id="editStatus" class="status" role="status"></p>
        </section>
        <section class="panel">
            <div class="row">
                <label for="result">修正結果</label>
                <button type="button" id="copy" disabled>コピー</button>
            </div>
            <textarea id="result" placeholder="ここに結果が表示されます。表示後はそのまま編集できます。" spellcheck="false"></textarea>
            <p id="copyStatus" class="status" role="status"></p>
        </section>
    </div>
</main>
<script id="geminiApi">
'use strict';

const GOOGLE_APIS = {
    developer: {
        name: 'Gemini Developer API',
        catalog: 'https://generativelanguage.googleapis.com/v1beta/models',
        models: 'https://generativelanguage.googleapis.com/v1beta/models/'
    },
    'vertex-express': {
        name: 'Vertex Express',
        catalog: 'https://aiplatform.googleapis.com/v1beta1/publishers/google/models',
        models: 'https://aiplatform.googleapis.com/v1/publishers/google/models/'
    }
};
// Model Garden listings can require permissions that Express generation does not.
// These published IDs are candidates for a request, never evidence of key access.
// https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/start/express-mode/overview
// https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions
const VERSIONED_CANDIDATES = ['gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.5-flash',
    'gemini-3-flash-preview', 'gemini-3.1-pro-preview', 'gemini-2.5-flash', 'gemini-2.5-pro'];
const PROBE_TEXT = '接続テストです。「OK」とだけ返してください。';
const MODEL_FAMILIES = { flash: 'Flash', pro: 'Pro' };

function modelFamily(id) {
    const alias = /^gemini-(flash|pro)-latest$/i.exec(id);
    if (alias) return { family: alias[1].toLowerCase(), version: '0', preview: false, revision: '' };
    const numbered = /^gemini-(\d+(?:\.\d+)*)-(flash|pro)((?:-(?:\d+|preview|exp|experimental|latest))*)$/i.exec(id);
    if (!numbered) return null;
    return {
        family: numbered[2].toLowerCase(), version: numbered[1],
        preview: /preview|exp/i.test(numbered[3]), revision: numbered[3]
    };
}

async function withTimeout(milliseconds, operation, parent) {
    if (parent?.aborted) throw new DOMException('中断しました', 'AbortError');
    const controller = new AbortController();
    const abort = () => controller.abort();
    parent?.addEventListener('abort', abort, { once: true });
    const timer = setTimeout(abort, milliseconds);
    try {
        return await operation(controller.signal);
    } catch (error) {
        if (!parent?.aborted && controller.signal.aborted) {
            const timeout = new Error('応答がタイムアウトしました。');
            timeout.name = 'TimeoutError';
            throw timeout;
        }
        throw error;
    } finally {
        clearTimeout(timer);
        parent?.removeEventListener('abort', abort);
    }
}

async function googleJson(url, key, body, signal) {
    const headers = { 'x-goog-api-key': key };
    if (body) headers['Content-Type'] = 'application/json';
    const response = await fetch(url, {
        method: body ? 'POST' : 'GET', headers, cache: 'no-store', redirect: 'error', signal,
        body: body ? JSON.stringify(body) : undefined
    });
    const data = await response.json().catch(error => {
        if (error.name === 'AbortError') throw error;
        return {};
    });
    if (!response.ok) {
        const detail = String(data.error?.message || response.statusText || '').split(key).join('***');
        const error = new Error('HTTP ' + response.status + (detail ? ' · ' + detail : ''));
        error.status = response.status;
        const details = Array.isArray(data.error?.details) ? data.error.details : [];
        error.keyDenied = details.some(item => /^(API_KEY_(INVALID|EXPIRED|SERVICE_BLOCKED|HTTP_REFERRER_BLOCKED|IP_ADDRESS_BLOCKED)|SERVICE_DISABLED)$/.test(item.reason));
        error.modelQuota = details.some(item => item.violations?.some(violation => violation.quotaDimensions?.model));
        error.retryLater = Boolean(response.headers.get('retry-after') || details.some(item => item.retryDelay));
        throw error;
    }
    return data;
}

async function getCatalog(provider, key, signal) {
    const listed = new Set();
    const catalog = { provider, listed, ids: [], limited: false, blocked: false, issue: '' };
    try {
        await withTimeout(12000, async requestSignal => {
            const pages = new Set();
            let token = '';
            do {
                if (pages.has(token)) throw new Error('モデル一覧のページを取得できませんでした。');
                pages.add(token);
                const url = new URL(GOOGLE_APIS[provider].catalog);
                url.searchParams.set('pageSize', '100');
                if (token) url.searchParams.set('pageToken', token);
                const data = await googleJson(url, key, null, requestSignal);
                const entries = provider === 'developer' ? data.models : data.publisherModels;
                for (const model of entries || []) {
                    if (provider === 'developer' && !model.supportedGenerationMethods?.includes('generateContent')) continue;
                    const id = (model.name || '').split('/').pop().split('@')[0];
                    if (/^gemini-[a-z0-9._-]+$/i.test(id)) listed.add(id);
                }
                token = data.nextPageToken;
            } while (token);
        }, signal);
    } catch (error) {
        if (signal.aborted) throw error;
        catalog.limited = true;
        catalog.issue = '一覧取得 · ' + error.message;
        catalog.blocked = Boolean(error.keyDenied || error.status === 429);
    }
    const ids = new Set(listed);
    if (!catalog.blocked && (provider === 'vertex-express' || catalog.limited)) {
        for (const id of VERSIONED_CANDIDATES) ids.add(id);
        if (provider === 'developer') {
            ids.add('gemini-flash-latest');
            ids.add('gemini-pro-latest');
        }
    }
    catalog.ids = [...ids];
    return catalog;
}

async function generateText(profile, instruction, source, signal) {
    const parts = [{ text: instruction }];
    if (source) parts.push({ text: source });
    const url = GOOGLE_APIS[profile.provider || 'developer'].models + encodeURIComponent(profile.model) + ':generateContent';
    const data = await withTimeout(source ? 90000 : 25000, requestSignal =>
        googleJson(url, profile.key, { contents: [{ role: 'user', parts }] }, requestSignal), signal);
    const candidate = data.candidates?.[0];
    if (candidate?.finishReason && candidate.finishReason !== 'STOP') {
        throw new Error('生成が途中で終了しました（' + candidate.finishReason + '）。');
    }
    const text = candidate?.content?.parts?.filter(part => !part.thought && part.text)
        .map(part => part.text).join('').trim();
    if (!text) throw new Error('テキスト応答を確認できませんでした。');
    return { text, modelVersion: typeof data.modelVersion === 'string' ? data.modelVersion : '' };
}

async function probeModel(key, provider, model, signal) {
    const { modelVersion } = await generateText({ key, provider, model }, PROBE_TEXT, '', signal);
    return { provider, model, modelVersion, checkedAt: Date.now() };
}

function rankCandidates(catalogs, family, preferred) {
    const candidates = [];
    for (const catalog of catalogs) {
        if (catalog.blocked) continue;
        for (const model of catalog.ids) {
            const info = modelFamily(model);
            if (info?.family === family) candidates.push({ ...info, model, catalog });
        }
    }
    const numeric = (a, b) => b.localeCompare(a, 'en', { numeric: true });
    return candidates.sort((a, b) =>
        numeric(a.version, b.version) || Number(a.preview) - Number(b.preview) ||
        numeric(a.revision, b.revision) ||
        Number(b.catalog.provider === preferred) - Number(a.catalog.provider === preferred) ||
        Number(b.catalog.listed.has(b.model)) - Number(a.catalog.listed.has(a.model)));
}

async function detectModels(key, preferred, signal, progress) {
    const catalogs = await Promise.all(Object.keys(GOOGLE_APIS).map(provider => getCatalog(provider, key, signal)));
    const choices = [];
    for (const [family, label] of Object.entries(MODEL_FAMILIES)) {
        const transientFailures = new Map();
        for (const { catalog, model } of rankCandidates(catalogs, family, preferred)) {
            if (signal.aborted) throw new DOMException('中断しました', 'AbortError');
            if (catalog.blocked || (transientFailures.get(catalog.provider) || 0) >= 2) continue;
            progress(label + ' を確認中 · ' + GOOGLE_APIS[catalog.provider].name + ' / ' + model);
            try {
                const choice = await probeModel(key, catalog.provider, model, signal);
                choices.push(choice);
                if (!catalog.listed.has(model)) catalog.limited = true;
                break;
            } catch (error) {
                if (signal.aborted) throw error;
                catalog.issue = model + ' · ' + error.message;
                if (error.keyDenied || error.status === 401 || (error.retryLater && !error.modelQuota) ||
                    error.name === 'TimeoutError' || error.name === 'TypeError') catalog.blocked = true;
                if ((error.status === 429 || error.status >= 500) && !error.modelQuota) {
                    transientFailures.set(catalog.provider, (transientFailures.get(catalog.provider) || 0) + 1);
                }
            }
        }
    }
    return { choices, catalogs };
}
</script>
<script>
'use strict';

const ui = Object.fromEntries(Array.from(document.querySelectorAll('[id]'), node => [node.id, node]));
const storage = {
    get(key) {
        try { return localStorage.getItem(key); }
        catch { return null; }
    },
    set(key, value) {
        localStorage.setItem(key, value);
    }
};

function savedProfiles() {
    try {
        const parsed = JSON.parse(storage.get('api_keys') || '[]');
        if (Array.isArray(parsed)) {
            const saved = parsed.filter(item =>
                item && typeof item.id === 'string' && typeof item.key === 'string' && item.key.trim());
            if (saved.length) return saved.map(item => ({
                ...item, provider: item.provider === 'vertex-express' ? 'vertex-express' : 'developer',
                model: typeof item.model === 'string' ? item.model : '',
                verifiedModels: Array.isArray(item.verifiedModels) ? item.verifiedModels : undefined
            }));
        }
    } catch {
        // A malformed settings record must not prevent the editor from opening.
    }
    const key = storage.get('gemini_api_key')?.trim();
    return key ? [{ id: 'legacy', name: '既存のAPIキー', provider: 'developer', key, model: '' }] : [];
}

let profiles = savedProfiles();
let active = profiles.find(profile => profile.id === storage.get('last_used_api_key_id')) || profiles[0];
let formProfile = null;
let choices = [];
let catalogs = [];
let run = null;
let pasteTimer = null;
let lastInput = '';
let lastAttempt = '';

function status(element, message, error = false) {
    element.textContent = message;
    element.dataset.error = String(error);
}

function stopWork() {
    clearTimeout(pasteTimer);
    pasteTimer = null;
    run?.controller.abort();
    run = null;
}

function updateControls() {
    const hasKey = Boolean(ui.key.value.trim());
    const busy = Boolean(run || pasteTimer !== null);
    ui.models.disabled = busy || !choices.length;
    ui.list.hidden = !hasKey;
    ui.list.disabled = busy;
    ui.save.disabled = busy || !hasKey || !ui.model.value.trim();
    ui.hydrogen.disabled = busy || !hasKey;
    ui.remove.hidden = !formProfile;
}

function startWork(kind) {
    stopWork();
    run = { kind, controller: new AbortController() };
    updateControls();
    return run;
}

function showSettings(open) {
    if (open === !ui.settings.hidden) return;
    ui.settings.hidden = !open;
    ui.toggleSettings.setAttribute('aria-expanded', String(open));
    ui.toggleSettings.textContent = open ? '設定を閉じる' : 'API設定';
    if (open) {
        renderProfiles();
        loadProfile(active);
    } else {
        stopWork();
        ui.advanced.open = false;
        ui.toggleSettings.focus();
    }
}

function routeId(choice) {
    return (choice.provider || 'developer') + '/' + choice.model;
}

function shownModel(choice) {
    return choice.modelVersion && choice.modelVersion !== choice.model
        ? choice.model + ' → ' + choice.modelVersion : choice.model;
}

function showActive() {
    const choice = active?.verifiedModels?.find?.(item => item && routeId(item) === routeId(active));
    ui.activeModel.textContent = active?.model
        ? GOOGLE_APIS[active.provider || 'developer'].name + ' · ' + shownModel(choice || active)
        : 'API設定にキーを貼り付けてください';
}

function matchingProfile(records, key, selectedId, preferredProvider) {
    const matches = records.filter(item => item.key.trim() === key);
    return matches.find(item => item.id === selectedId)
        || matches.find(item => (item.provider || 'developer') === preferredProvider)
        || matches[0];
}

function renderProfiles() {
    ui.savedKeysField.hidden = !profiles.length;
    ui.profiles.replaceChildren(new Option('新しいキーを入力', ''));
    for (const item of profiles) {
        const suffix = item.key.length > 4 ? ' · 末尾 ' + item.key.slice(-4) : '';
        const api = GOOGLE_APIS[item.provider || 'developer'].name;
        const nickname = item.name && !['Google AI Studio', 'Gemini Developer API', 'Vertex Express', 'API接続'].includes(item.name)
            ? item.name + ' · ' : '';
        ui.profiles.add(new Option(nickname + api + suffix, item.id));
    }
}

function manualOptions() {
    const ids = new Set(['gemini-4-hydrogen']);
    const catalog = catalogs.find(item => item.provider === ui.provider.value);
    for (const id of catalog?.listed || []) {
        if (!/-(?:image|embedding|live|tts)(?:-|$)/i.test(id)) ids.add(id);
    }
    ui.manualCandidates.replaceChildren(...Array.from(ids, id => new Option(id, id)));
}

function renderForm(profile) {
    formProfile = profile || null;
    ui.profiles.value = profile?.id || '';
    choices = (Array.isArray(profile?.verifiedModels) ? profile.verifiedModels : []).filter(item =>
        item && Object.keys(GOOGLE_APIS).includes(item.provider) && typeof item.model === 'string' && item.checkedAt);
    // Older installations saved a selection without a successful generation timestamp.
    if (profile?.model && !choices.some(item => routeId(item) === routeId(profile))) {
        choices = [...choices, { provider: profile.provider || 'developer', model: profile.model }];
    }
    ui.models.replaceChildren();
    if (!choices.length) ui.models.add(new Option(ui.key.value.trim() ? '確認できたモデルを表示します' : 'APIキーを貼り付けてください', ''));
    for (const choice of choices) {
        const family = MODEL_FAMILIES[modelFamily(choice.model)?.family];
        const label = (family ? family + ' · ' : '') + shownModel(choice) + ' · ' + GOOGLE_APIS[choice.provider].name;
        ui.models.add(new Option(label + (choice.checkedAt ? '' : '（保存済み・未確認）'), routeId(choice)));
    }
    if (profile?.model) ui.models.value = routeId(profile);
    ui.apiName.textContent = profile?.model ? GOOGLE_APIS[profile.provider || 'developer'].name : '自動判定';
    updateControls();
}

function resetInput(profile) {
    stopWork();
    catalogs = [];
    lastInput = ui.key.value.trim();
    lastAttempt = '';
    ui.model.value = '';
    ui.provider.value = profile?.provider || 'developer';
    renderForm(profile);
    manualOptions();
    status(ui.connectionStatus, '');
    ui.apiDetails.textContent = '';
    const selected = choices.find(item => routeId(item) === ui.models.value);
    const note = selected?.checkedAt
        ? '前回の応答確認 · ' + new Date(selected.checkedAt).toLocaleString('ja-JP')
        : selected ? '以前の設定です。「Flash / Pro を再確認」で現在の応答を確認できます。' : '';
    status(ui.listStatus, note);
}

function loadProfile(profile) {
    ui.key.value = profile?.key || '';
    resetInput(profile);
    lastAttempt = lastInput;
}

const previousModes = {
    getPromptTemplate(inputType = 'audio') {
        const selectedMode = ui.mode.value;
        const isText = inputType === 'text';
        const SRC = isText ? 'テキスト' : '音声';
        const UNCLEAR = isText ? '判読できなかった' : '聞き取れなかった';

function storeProfiles(next, selected) {
    const previousId = storage.get('last_used_api_key_id') || '';
    try {
        storage.set('last_used_api_key_id', selected?.id || '');
        try {
            storage.set('api_keys', JSON.stringify(next));
        } catch (error) {
            storage.set('last_used_api_key_id', previousId);
            throw error;
        }
    } catch {
        throw new Error('このブラウザに設定を保存できませんでした。ブラウザの保存設定を確認してください。');
    }
    profiles = next;
    active = selected;
}

function restoreClinicalSelection() {
    if (profiles.some(item => Array.isArray(item.verifiedModels))) return;
    const clinicalId = storage.get('voice_rec_clinical_profile');
    const clinical = profiles.find(item => item.id === clinicalId);
    if (!clinical) return;
    const model = storage.get('voice_rec_clinical_model');
    if (/^gemini-[a-z0-9][a-z0-9._-]*$/i.test(model || '')) clinical.model = model;
    clinical.verifiedModels = [];
    active = clinical;
    try {
        storeProfiles(profiles, clinical);
    } catch {
        // Read-only browser storage still permits use of the restored settings in this tab.
    }
}

function useChoice(key, choice, confirmed) {
    const records = savedProfiles();
    const original = matchingProfile(records, key, formProfile?.id, choice.provider);
    const profile = {
        ...original, key, provider: choice.provider, model: choice.model, verifiedModels: confirmed.filter(item => item.checkedAt),
        id: original?.id || globalThis.crypto?.randomUUID?.() || String(Date.now()),
        name: original?.name || GOOGLE_APIS[choice.provider].name
    };
    const next = original ? records.map(item => item.id === original.id ? profile : item) : records.concat(profile);
    storeProfiles(next, profile);
    renderProfiles();
    renderForm(profile);
    showActive();
}

async function autoSelect() {
    const key = ui.key.value.trim();
    if (!key) return;
    const previous = formProfile;
    const preferred = previous?.provider || 'developer';
    const job = startWork('auto');
    lastAttempt = key;
    status(ui.connectionStatus, '');
    status(ui.listStatus, 'Googleの2つのAPIからモデル候補を取得中…');
    ui.apiDetails.textContent = '';
    try {
        const result = await detectModels(key, preferred, job.controller.signal, message => {
            if (run === job) status(ui.listStatus, message);
        });
        if (run !== job) return;
        catalogs = result.catalogs;
        const confirmed = result.choices;
        ui.apiDetails.textContent = catalogs.map(catalog => {
            const successes = confirmed.filter(item => item.provider === catalog.provider).map(item => item.model);
            const summary = successes.length ? successes.join('、') + ' の応答を確認' : 'Flash / Pro の応答は未確認';
            const details = catalog.issue ? '（' + catalog.issue.slice(0, 160) + '）' : '';
            return GOOGLE_APIS[catalog.provider].name + ' · ' + summary + details;
        }).join('\n');
        manualOptions();
        if (!confirmed.length) {
            const issue = catalogs.find(item => item.issue)?.issue;
            status(ui.listStatus, 'Flash / Pro のテキスト応答を確認できませんでした。' +
                (issue ? ' ' + issue.slice(0, 120) + '。' : '') +
                (previous?.model ? ' 前回保存した設定を表示しています。' : '') +
                ' 詳細設定で各APIの結果を確認できます。', true);
            return;
        }
        const preferredFamily = modelFamily(previous?.model)?.family || 'flash';
        const selected = confirmed.find(item => modelFamily(item.model).family === preferredFamily) || confirmed[0];
        useChoice(key, selected, confirmed);
        ui.provider.value = selected.provider;
        manualOptions();
        const missing = Object.entries(MODEL_FAMILIES)
            .filter(([family]) => !confirmed.some(item => modelFamily(item.model).family === family))
            .map(([, name]) => name);
        const limited = confirmed.some(item => catalogs.find(c => c.provider === item.provider).limited);
        status(ui.listStatus, shownModel(selected) + ' を自動設定しました。' +
            (missing.length ? ' ' + missing.join(' / ') + ' は今回未確認です。' : ' Flash と Pro を切り替えられます。') +
            (limited ? ' 一覧を補うため公開済みのモデルIDも照合しました。' : ''));
    } catch (error) {
        if (run === job) status(ui.listStatus, error.message, true);
    } finally {
        if (run === job) {
            run = null;
            updateControls();
        }
    }
}

    } catch (error) {
        if (run === job) {
            status(ui.connectionStatus, GOOGLE_APIS[provider].name + ' で ' + model + ' を設定できませんでした。' + error.message, true);
            if (formProfile?.model === model && formProfile.provider === provider) {
                status(ui.listStatus, '今回の応答を確認できませんでした。前回保存した設定を表示しています。', true);
            }
        }
    } finally {
        if (run === job) {
            run = null;
            updateControls();
        }
    }
}

ui.toggleSettings.addEventListener('click', () => showSettings(ui.settings.hidden));
ui.profiles.addEventListener('change', () => {
    const selected = profiles.find(item => item.id === ui.profiles.value);
    if (selected?.model) {
        try {
            storage.set('last_used_api_key_id', selected.id);
        } catch {
            ui.profiles.value = formProfile?.id || '';
            status(ui.connectionStatus, '使用するキーを保存できませんでした。', true);
            return;
        }
        active = selected;
        showActive();
    }
    loadProfile(selected);
    if (selected && !selected.model) autoSelect();
    if (!selected) ui.key.focus();
});

function keyEdited(complete) {
    resetInput(matchingProfile(profiles, ui.key.value.trim(), ui.profiles.value, active?.provider));
    if (complete) queueDetection();
}
ui.key.addEventListener('paste', event => {
    const pasted = event.clipboardData?.getData('text/plain')?.trim();
    if (!pasted) return;
    event.preventDefault();
    ui.key.value = pasted;
    keyEdited(true);
});
ui.key.addEventListener('input', event => {
    const key = ui.key.value.trim();
    const bulk = key.length > lastInput.length + 1 || event.data?.length > 1 ||
        ['insertFromPaste', 'insertReplacementText', 'insertFromDrop'].includes(event.inputType);
    keyEdited(bulk);
});
ui.key.addEventListener('change', queueDetection);
ui.key.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        event.preventDefault();
        queueDetection();
    }
});
ui.list.addEventListener('click', autoSelect);
ui.models.addEventListener('change', () => {
    const choice = choices.find(item => routeId(item) === ui.models.value);
    if (!choice?.checkedAt) return;
    try {
        useChoice(ui.key.value.trim(), choice, choices);
        ui.provider.value = choice.provider;
        manualOptions();
        status(ui.listStatus, '使用モデルを ' + shownModel(choice) + ' に切り替えました。応答確認 · ' +
            new Date(choice.checkedAt).toLocaleString('ja-JP'));
    } catch (error) {
        renderForm(formProfile);
        status(ui.listStatus, error.message, true);
    }
});
function manualInputChanged() {
    if (run?.kind === 'manual') stopWork();
    status(ui.connectionStatus, '');
    updateControls();
}
ui.provider.addEventListener('change', () => {
    manualInputChanged();
    manualOptions();
});
ui.model.addEventListener('input', manualInputChanged);
ui.save.addEventListener('click', () => useManualModel(ui.model.value.trim().replace(/^models\//, '')));
ui.hydrogen.addEventListener('click', () => {
    ui.model.value = 'gemini-4-hydrogen';
    useManualModel(ui.model.value);
});
ui.remove.addEventListener('click', () => {
    const records = savedProfiles();
    const selected = records.find(item => item.id === formProfile?.id && item.key.trim() === ui.key.value.trim());
    if (!selected || !confirm('このブラウザから選択中のAPIキーを削除しますか？')) return;
    stopWork();
    try {
        const next = records.filter(item => item.id !== selected.id);
        storeProfiles(next, next.find(item => item.id === active?.id) || next[0]);
        if (!next.length || selected.key === storage.get('gemini_api_key')?.trim()) localStorage.removeItem('gemini_api_key');
        renderProfiles();
        loadProfile(active);
        showActive();
        status(ui.connectionStatus, '選択したキーを削除しました。');
    } catch (error) {
        status(ui.connectionStatus, error.message, true);
    } finally {
        updateControls();
    }
});

ui.rewrite.addEventListener('click', async () => {
    const original = ui.source.value;
    if (!original.trim()) {
        status(ui.editStatus, '原文を貼り付けてください。', true);
        ui.source.focus();
        return;
    }
    if (!active?.key || !active.model || (!ui.settings.hidden && (run || pasteTimer !== null ||
        ui.key.value.trim() !== active.key.trim() || formProfile?.id !== active.id))) {
        showSettings(true);
        ui.settings.scrollIntoView({ block: 'nearest' });
        status(ui.editStatus, run || pasteTimer !== null
            ? 'API設定の確認が終わってから「整える」を押してください。'
            : 'API設定にキーを貼り付けると、使用モデルを自動で確認します。', true);
        return;
    }
    ui.rewrite.disabled = true;
    ui.result.readOnly = true;
    status(ui.copyStatus, '');
    status(ui.editStatus, '原文を送信しました。修正中…');
    try {
        ui.result.value = (await generateText(active, instruction(), original)).text;
        ui.copy.disabled = false;
        status(ui.editStatus, ui.source.value === original
            ? '修正しました。原文と照合して結果を確認してください。'
            : '送信時点の原文で修正しました。現在の原文でもう一度実行できます。');
        if (matchMedia('(max-width: 680px)').matches) ui.result.scrollIntoView({ block: 'nearest' });
    } catch (error) {
        status(ui.editStatus, error.message + ' 原文はそのまま再送できます。', true);
        if (ui.result.value) status(ui.copyStatus, '前回の結果を表示しています。');
    } finally {
        ui.rewrite.disabled = false;
        ui.result.readOnly = false;
    }
});
ui.result.addEventListener('input', () => {
    ui.copy.disabled = !ui.result.value.trim();
    status(ui.copyStatus, '');
});
ui.copy.addEventListener('click', async () => {
    try {
        await navigator.clipboard.writeText(ui.result.value);
        status(ui.copyStatus, 'コピーしました。');
    } catch {
        ui.result.focus();
        ui.result.select();
        status(ui.copyStatus, '選択した結果を端末のコピー操作でコピーしてください。');
    }
});

restoreClinicalSelection();
showActive();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.warn);
</script>
</body>
</html>
